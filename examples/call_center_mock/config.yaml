# Call Center Deep Research - Configuration for mock analytics agent

llm:
  api_key: "your-openai-api-key-here"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  max_tokens: 4000
  temperature: 0.3

execution:
  max_clarifications: 2
  max_iterations: 8
  logs_dir: "logs"
  reports_dir: "reports"

agents:
  call_center_deep_research:
    base_class: "agents.CallCenterDeepResearchAgent"
    tools:
      - "CallCenterLoadDatasetTool"
      - "CallCenterAggregateTool"
      - "GeneratePlanTool"
      - "AdaptPlanTool"
      - "ClarificationTool"
      - "FinalAnswerTool"
